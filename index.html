<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#23483a" />
  <meta name="description" content="Домашние запасы — простой учёт продуктов и семейных покупок, без подписки." />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" href="icons/icon-192.png" />
  <link rel="stylesheet" href="styles.css" />
  <title>Домашние запасы</title>
</head>
<body>
  <div class="shell">
    <header class="app-header">
      <div class="brand"><span class="logo" aria-hidden="true">▦</span><div><div class="brand-name">Домашние запасы</div><div class="brand-sub">Семейный учёт без лишних действий</div></div></div>
      <button class="icon-btn" id="backupShortcut" title="Резервные копии" aria-label="Резервные копии">⇩</button>
    </header>
    <main id="view" aria-live="polite"></main>
    <nav class="bottom-nav" aria-label="Разделы приложения">
      <button class="nav-item active" data-page="home"><span class="nav-icon">⌂</span><span>Главная</span></button>
      <button class="nav-item" data-page="stock"><span class="nav-icon">▤</span><span>Запасы</span></button>
      <button class="nav-item" data-page="audit"><span class="nav-icon">≡</span><span>Ревизия</span></button>
      <button class="nav-item" data-page="shopping"><span class="nav-icon">▣</span><span>Покупки</span></button>
      <button class="nav-item" data-page="settings"><span class="nav-icon">⚙</span><span>Ещё</span></button>
    </nav>
  </div>
  <dialog id="modal"><div id="modalInner"></div></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="app.js" defer></script>
</body>
</html>
